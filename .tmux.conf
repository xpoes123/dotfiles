# Prefix: Ctrl+A (more ergonomic than Ctrl+B)
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Vi keys everywhere
set -g mode-keys vi
set -g status-keys vi

# Copy mode with vi keys + wl-copy for Wayland clipboard
bind v copy-mode
bind [ copy-mode
bind -T copy-mode-vi v   send -X begin-selection
bind -T copy-mode-vi V   send -X select-line
bind -T copy-mode-vi y   send -X copy-pipe-and-cancel "wl-copy"
bind -T copy-mode-vi Enter send -X copy-pipe-and-cancel "wl-copy"
bind -T copy-mode-vi Escape send -X cancel

# Paste from system clipboard
bind ] run "wl-paste | tmux load-buffer - && tmux paste-buffer"

# Intuitive splits (same directory)
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# Navigate panes with Alt+arrows (no prefix needed)
bind -n M-Left  select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up    select-pane -U
bind -n M-Down  select-pane -D

# New windows start at 1, not 0
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

# Increase scrollback
set -g history-limit 10000

# True color
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

# No delay on Escape
set -s escape-time 0

# Mouse support (click to select pane/window, scroll)
set -g mouse on

# Status bar
set -g status-position bottom
set -g status-style bg=default
set -g status-left "#[fg=blue,bold] #S "
set -g status-right "#[fg=white,dim] %H:%M "
set -g window-status-current-style fg=blue,bold
