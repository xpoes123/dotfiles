format = """
$directory$git_branch$git_status$python$nodejs$cmd_duration
$character"""

add_newline = false

[directory]
style = "bold #7aa2f7"
truncation_length = 3
truncate_to_repo = true
read_only = " 󰌾"

[git_branch]
symbol = " "
style = "bold #bb9af7"
format = "[$symbol$branch]($style) "

[git_status]
style = "#f7768e"
format = "[$all_status$ahead_behind]($style) "
ahead = "⇡$count"
behind = "⇣$count"
modified = "!"
untracked = "?"
staged = "+"
deleted = "✘"

[python]
symbol = " "
style = "#e0af68"
format = "[$symbol$version]($style) "
detect_files = ["*.py", "pyproject.toml", "requirements.txt"]

[nodejs]
symbol = " "
style = "#9ece6a"
format = "[$symbol$version]($style) "

[cmd_duration]
min_time = 2000
style = "#565f89"
format = "[ $duration]($style) "

[character]
success_symbol = "[❯](#7aa2f7)"
error_symbol = "[❯](#f7768e)"
vimcmd_symbol = "[❮](#bb9af7)"
