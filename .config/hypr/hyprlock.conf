background {
    monitor =
    color = rgba(26, 27, 38, 1.0)
}

label {
    monitor =
    text = cmd[update:1000] echo "$(date +'%H:%M')"
    color = rgba(122, 162, 247, 0.95)
    font_size = 96
    font_family = MesloLGM Nerd Font Mono Bold
    halign = center
    valign = center
    position = 0, 120
}

label {
    monitor =
    text = cmd[update:60000] echo "$(date +'%A, %B %d')"
    color = rgba(86, 95, 137, 0.9)
    font_size = 18
    font_family = MesloLGM Nerd Font Mono
    halign = center
    valign = center
    position = 0, 30
}

input-field {
    monitor =
    size = 300, 50
    outline_thickness = 1
    outer_color = rgba(65, 72, 104, 0.8)
    inner_color = rgba(36, 40, 59, 1.0)
    font_color = rgba(192, 202, 245, 1.0)
    font_family = MesloLGM Nerd Font Mono
    placeholder_text =
    fail_text =  wrong
    fail_color = rgba(247, 118, 142, 0.9)
    dots_size = 0.25
    dots_spacing = 0.35
    halign = center
    valign = center
    position = 0, -60
    rounding = 8
}
